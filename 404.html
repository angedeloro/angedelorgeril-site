<script>document.getElementById('annee').textContent = new Date().getFullYear();

  // Interrupteur clair / sombre
  (function () {
    var b = document.getElementById('theme-toggle');
    if (!b) return;
    var root = document.documentElement;
    function sync() {
      var dark = root.getAttribute('data-theme') === 'dark';
      b.setAttribute('aria-label', dark ? 'Passer en mode clair' : 'Passer en mode sombre');
      var m = document.querySelector('meta[name=theme-color]');
      if (m) m.setAttribute('content', dark ? '#14130f' : '#f6f1e7');
    }
    sync();
    b.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
  })();
</script>
